[package]
name = "vgui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gpui.workspace = true
vgui-css.workspace = true
vgui-view.workspace = true
vgui-tailwind.workspace = true
vgui-tailwind-core.workspace = true
shortcuts.workspace = true
anyhow = "1"

[features]
default = []
test-support = ["gpui/test-support"]

[dev-dependencies]
trybuild = "1"
gpui = { workspace = true, features = ["test-support"] }
gpui-platform.workspace = true
parking_lot = "0.12"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Event", "KeyboardEvent", "EventTarget", "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
