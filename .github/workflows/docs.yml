name: Docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libclang-dev \
            libssl-dev libzstd-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libgl-dev libegl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check quick-start example
        run: cargo check -p vgui --example counter --locked
      - name: Install website dependencies
        run: npm ci --prefix website
      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Build Starlight and API docs
        run: npm run build --prefix website
      - name: Test documentation site
        run: npm run test:e2e --prefix website
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
