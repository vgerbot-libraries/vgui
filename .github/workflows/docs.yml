name: Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libclang-dev \
            libssl-dev libzstd-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libgtk-3-dev libasound2-dev libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libgl-dev libegl-dev
      - uses: Swatinem/rust-cache@v2
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'
      - name: Build book
        run: mdbook build book
      - name: Build API docs
        run: cargo doc --workspace --no-deps
      - name: Copy API docs into book output
        run: |
          mkdir -p book/book/api
          cp -r target/doc/* book/book/api/
      - name: Disable Jekyll
        run: touch book/book/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
