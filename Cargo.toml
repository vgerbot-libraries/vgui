[workspace]
resolver = "2"
members = ["crates/vgui-css", "crates/vgui-view", "crates/vgui-tailwind-core", "crates/vgui-tailwind", "crates/vgui", "examples/counter", "examples/todolist", "examples/inputs", "examples/tags-demo", "examples/theming", "examples/variants", "examples/focus-management", "examples/ref-demo", "examples/context", "examples/animation"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vgerbot-libraries/vgui"
homepage = "https://github.com/vgerbot-libraries/vgui"
description = "A declarative, reactive GUI framework for Rust, built on gpui."
keywords = ["gui", "gpui", "reactive", "css", "tailwind"]
categories = ["gui", "rust-patterns", "macro"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11"] }
vgui-css = { path = "crates/vgui-css" }
vgui-view = { path = "crates/vgui-view" }
vgui-tailwind-core = { path = "crates/vgui-tailwind-core" }
vgui-tailwind = { path = "crates/vgui-tailwind" }
vgui = { path = "crates/vgui" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[profile.dev]
debug = 0
incremental = false
opt-level = 0

[profile.test]
debug = 0
incremental = false
