[workspace]
resolver = "2"
members = ["crates/vgui-css", "crates/vgui-view", "crates/vgui", "examples/counter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/vgui"

[workspace.dependencies]
gpui = "0.2.2"
vgui-css = { path = "crates/vgui-css" }
vgui-view = { path = "crates/vgui-view" }
vgui = { path = "crates/vgui" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[profile.dev]
debug = 0
incremental = false
opt-level = 0

[profile.test]
debug = 0
incremental = false
